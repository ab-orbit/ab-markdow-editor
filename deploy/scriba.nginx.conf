# Static public PWA. No filesystem/Git API is exposed on this origin.
server {
    listen 80;
    listen [::]:80;
    server_name scriba.aeonbridge.app;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scriba.aeonbridge.app;
    ssl_certificate /etc/nginx/ssl/vane_origin.pem;
    ssl_certificate_key /etc/nginx/ssl/vane_origin.key;
    root /var/www/scriba/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location ^~ /api/ { return 404; }
    location = /sw.js { add_header Cache-Control 'no-cache, no-store, must-revalidate'; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control no-cache; try_files $uri =404; }
    location / { add_header Cache-Control no-cache; try_files $uri $uri/ =404; }
}
